name: CounselorAssistant
options:
  bundleIdPrefix: com.counselorassistant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.10
    GENERATE_INFOPLIST_FILE: NO
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
targets:
  CounselorAssistant:
    type: application
    platform: iOS
    sources:
      - path: CounselorAssistant
        excludes:
          - Resources/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.counselorassistant.app
        INFOPLIST_FILE: CounselorAssistant/Resources/Info.plist
        PRODUCT_NAME: CounselorAssistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - CounselorAssistantTests
  CounselorAssistantTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CounselorAssistantTests
    dependencies:
      - target: CounselorAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.counselorassistant.app.tests
